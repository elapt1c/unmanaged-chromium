name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux package
        run: ./scripts/build-linux.sh

      - name: Build Windows package
        run: ./scripts/build-windows.sh

      - name: Archive
        run: |
          tar -czf unmanaged-chromium-linux-x64.tar.gz -C dist unmanaged-chromium-linux-x64
          (cd dist && zip -qr ../unmanaged-chromium-windows-x64.zip unmanaged-chromium-windows-x64)
          ls -lh unmanaged-chromium-*

      - uses: actions/upload-artifact@v4
        with:
          name: unmanaged-chromium
          path: |
            unmanaged-chromium-linux-x64.tar.gz
            unmanaged-chromium-windows-x64.zip
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            unmanaged-chromium-linux-x64.tar.gz
            unmanaged-chromium-windows-x64.zip
          generate_release_notes: true
