name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable package
        run: ./scripts/build-linux.sh
      - name: Archive
        run: tar -czf unmanaged-chromium-linux-x64.tar.gz -C dist unmanaged-chromium-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: unmanaged-chromium-linux-x64
          path: unmanaged-chromium-linux-x64.tar.gz
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable package
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1
      - name: Archive
        shell: powershell
        run: Compress-Archive -Path dist\unmanaged-chromium-windows-x64 -DestinationPath unmanaged-chromium-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: unmanaged-chromium-windows-x64
          path: unmanaged-chromium-windows-x64.zip
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            unmanaged-chromium-linux-x64.tar.gz
            unmanaged-chromium-windows-x64.zip
          generate_release_notes: true
